name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest generator/tests -q
      # The corpora are fetched, not vendored — see generator/README.md.
      - run: ./fetch-corpora.sh
        working-directory: generator
      # The shipped calendar has to pass on every push, *with* the dictionary:
      # the weld check is the one that catches a compound that does not exist,
      # and a green run without it would be worse than no run at all.
      #
      # SALDO is not fetched here — it is a separately-licensed upload, not a
      # URL. The two checks that need its lemma inventory therefore fall back
      # to hand-built lists, and those lists are wrong in places: they call
      # `band` an inflection of binda and `lång` the stem of the fish-verb
      # långa. Those checks warn rather than block when SALDO is missing, so
      # this step fails on the evidence it actually has.
      - run: python -m kedjan.cli lint ../public/days.json --dic sv_SE.dic
        working-directory: generator
