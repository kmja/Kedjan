name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest generator/tests -q
      # The shipped calendar has to pass the curation rules on every push.
      # Without --dic this is the structural check only; the lexicon-backed
      # weld check needs the corpora, which are not in the repository.
      - run: python -m kedjan.cli lint ../public/days.json
        working-directory: generator
